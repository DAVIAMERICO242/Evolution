version: '3.3'

services:
  redis:
    image: redis:latest
    networks:
      - evolution-net
    container_name: redis
    command: >
      redis-server --port 6380 --appendonly yes
    volumes:
      - evolution_redis:/data
    ports:
      - 6380:6380

volumes:
  evolution_redis:


networks:
  evolution-net:
    name: evolution-net
    driver: bridge
